# Netlify static deploy config
# The whole game is a single self-contained file built by wasm/build.sh.
# The build command creates the publish dir and refreshes public/index.html
# from the latest wasm build. Both wasm/apricots.html and netlify.toml must
# be committed to the repo for this to run.
[build]
  command = "mkdir -p public && cp wasm/apricots.html public/index.html"
  publish = "public"